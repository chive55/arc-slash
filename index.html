<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arc Slash</title>
  <meta name="description" content="Tap to slash a neon arc. Clear the swarm before it closes in. Tiny browser arcade.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Arc Slash">
  <meta property="og:description" content="Tap to slash a neon arc. Clear the swarm before it closes in.">
  <meta property="og:url" content="https://chive55.itch.io/arc-slash">
  <meta property="og:image" content="https://raw.githubusercontent.com/chive55/arc-slash/main/og.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Arc Slash">
  <meta name="twitter:description" content="Tap to slash a neon arc. Clear the swarm before it closes in.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/chive55/arc-slash/main/og.svg">
  <link rel="canonical" href="https://chive55.itch.io/arc-slash">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #080B18; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #eef2ff;
    }
    #top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #score { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; font-size: 1.1rem; }
    #best { opacity: 0.7; font-size: 0.9rem; }
    #mute {
      pointer-events: auto; min-height: 44px; min-width: 44px; padding: 0 12px;
      border: 1px solid #ffffff22; border-radius: 10px; background: #0b0d18cc;
      color: #eef2ff; cursor: pointer; font: inherit;
    }
    #panel {
      pointer-events: auto; text-align: center; background: #0b0d18ee;
      border: 1px solid #53E6FF44; border-radius: 16px; padding: 24px 28px; max-width: 420px;
    }
    #panel h1 { margin: 0 0 8px; letter-spacing: 0.14em; font-size: 1.6rem; color: #fff; }
    #panel h1 span { color: #53E6FF; text-shadow: 0 0 18px #53E6FF88; }
    #panel p { margin: 0 0 16px; color: #B8C3E4; line-height: 1.4; }
    button.go {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
      background: #53E6FF; color: #080B18; font-weight: 700; cursor: pointer; font-size: 1rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="top">
      <div>
        <div id="score">0</div>
        <div id="best">Best 0</div>
      </div>
      <button id="mute" type="button">Sound on</button>
    </div>
    <div id="panel">
      <h1>ARC <span>SLASH</span></h1>
      <p>Tap to slash a neon arc.<br>Clear the swarm before it closes in.</p>
      <button class="go" id="go" type="button">Play</button>
    </div>
  </div>
  <script>
    const audio = (() => {
      const KEY = 'arc-slash-mute';
      let ctx, master, muted = false, pulseOsc = null, pulseGain = null;
      try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
      function ac() {
        if (!ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
          master = ctx.createGain();
          master.gain.value = muted ? 0 : 0.22;
          master.connect(ctx.destination);
        }
        return ctx;
      }
      function unlock() {
        const c = ac();
        if (c && c.state === 'suspended') c.resume();
      }
      function setMuted(on) {
        muted = !!on;
        try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.value = muted ? 0 : 0.22;
        if (muted) pulse(false);
      }
      function env(start, peak, dur) {
        const c = ac(); if (!c || muted) return null;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(peak, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(master);
        return g;
      }
      function tone(freq, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, t);
        o.connect(env(t, peak || 0.2, dur || 0.12));
        o.start(t);
        o.stop(t + (dur || 0.12) + 0.02);
      }
      function sweep(from, to, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'sawtooth';
        o.frequency.setValueAtTime(from, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        o.connect(env(t, peak || 0.18, dur));
        o.start(t);
        o.stop(t + dur + 0.02);
      }
      function noise(dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const n = Math.max(1, Math.floor(c.sampleRate * dur));
        const buf = c.createBuffer(1, n, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = 'highpass';
        f.frequency.value = 900;
        src.connect(f);
        f.connect(env(t, peak || 0.16, dur));
        src.start(t);
        src.stop(t + dur + 0.02);
      }
      function pulse(on) {
        const c = ac();
        if (!c) return;
        if (!on || muted) {
          if (pulseOsc) { try { pulseOsc.stop(); } catch (e) {} pulseOsc = null; pulseGain = null; }
          return;
        }
        if (pulseOsc) return;
        pulseOsc = c.createOscillator();
        pulseGain = c.createGain();
        pulseOsc.type = 'triangle';
        pulseOsc.frequency.value = 98;
        pulseGain.gain.value = 0.03;
        pulseOsc.connect(pulseGain);
        pulseGain.connect(master);
        pulseOsc.start();
      }
      const api = {
        unlock, setMuted, isMuted: () => muted, pulse,
        start() { tone(392, 'square', 0.08, 0.16); tone(523, 'square', 0.12, 0.14); },
        tap() { tone(720, 'square', 0.05, 0.15); sweep(880, 420, 'sawtooth', 0.09, 0.12); },
        score() { sweep(520, 980, 'square', 0.12, 0.16); },
        miss() { noise(0.07, 0.1); tone(160, 'sawtooth', 0.09, 0.09); },
        die() { pulse(false); sweep(320, 60, 'sawtooth', 0.42, 0.22); noise(0.18, 0.12); }
      };
      window.audio = api;
      return api;
    })();

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const panel = document.getElementById('panel');
    const go = document.getElementById('go');
    const muteBtn = document.getElementById('mute');

    let running = false, score = 0, best = 0, shake = 0, t = 0;
    let threats = [], particles = [], arcs = [];
    let spawnTimer = 0, difficulty = 1;
    const CORE_R = 18;

    try { best = Number(localStorage.getItem('arc-slash-best') || 0); } catch (e) {}
    bestEl.textContent = 'Best ' + best;

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
    }
    addEventListener('resize', resize);
    resize();

    muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    muteBtn.onclick = () => {
      audio.unlock();
      audio.setMuted(!audio.isMuted());
      muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    };

    function cx() { return canvas.width * 0.5; }
    function cy() { return canvas.height * 0.5; }

    function reset() {
      threats = [];
      particles = [];
      arcs = [];
      spawnTimer = 0.5;
      difficulty = 1;
      score = 0;
      shake = 0;
      t = 0;
      scoreEl.textContent = '0';
    }

    go.onclick = () => {
      audio.unlock();
      audio.start();
      audio.pulse(true);
      panel.classList.add('hidden');
      running = true;
      reset();
    };

    function pointer(e) {
      const x = (e.touches ? e.touches[0].clientX : e.clientX) * devicePixelRatio;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) * devicePixelRatio;
      return { x, y };
    }

    function slash(px, py) {
      if (!running) return;
      const dx = px - cx(), dy = py - cy();
      const ang = Math.atan2(dy, dx);
      arcs.push({ ang, life: 0.2, max: 0.2, width: 0.88 + Math.min(0.18, difficulty * 0.025) });
      audio.tap();
      const reach = Math.min(canvas.width, canvas.height) * 0.36;
      for (let i = 0; i < 6; i++) {
        const a = ang + (Math.random() - 0.5) * 0.4;
        particles.push({
          x: cx() + Math.cos(a) * reach * 0.7,
          y: cy() + Math.sin(a) * reach * 0.7,
          vx: Math.cos(a) * (2 + Math.random() * 4) * devicePixelRatio,
          vy: Math.sin(a) * (2 + Math.random() * 4) * devicePixelRatio,
          life: 0.25 + Math.random() * 0.15,
          max: 0.4,
          col: '#53E6FF'
        });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!running) return;
      const p = pointer(e);
      slash(p.x, p.y);
    });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) audio.pulse(false);
      else if (running) { audio.unlock(); audio.pulse(true); }
    });

    function spawnThreat() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const m = 40 * devicePixelRatio;
      if (side === 0) { x = Math.random() * canvas.width; y = -m; }
      else if (side === 1) { x = canvas.width + m; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + m; }
      else { x = -m; y = Math.random() * canvas.height; }
      threats.push({
        x, y,
        r: (10 + Math.random() * 6) * devicePixelRatio,
        hp: 1
      });
    }

    function burst(x, y, col, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (1 + Math.random() * 3.5) * devicePixelRatio;
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 0.3 + Math.random() * 0.25,
          max: 0.55,
          col
        });
      }
    }

    function die() {
      running = false;
      audio.die();
      shake = 14;
      burst(cx(), cy(), '#FF4D68', 28);
      if (score > best) {
        best = score;
        try { localStorage.setItem('arc-slash-best', String(best)); } catch (e) {}
        bestEl.textContent = 'Best ' + best;
      }
      panel.querySelector('p').innerHTML = 'Score <b style="color:#53E6FF">' + score + '</b><br>Best ' + best;
      go.textContent = 'Again';
      panel.classList.remove('hidden');
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.033, (now - (loop.last || now)) / 1000) || 0.016;
      loop.last = now;
      t += dt;
      const w = canvas.width, h = canvas.height;
      const ox = (Math.random() - 0.5) * shake * 2;
      const oy = (Math.random() - 0.5) * shake * 2;
      shake *= 0.88;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#080B18';
      ctx.fillRect(0, 0, w, h);
      ctx.save();
      ctx.translate(ox, oy);
      ctx.strokeStyle = '#111A38';
      ctx.lineWidth = 1;
      const gstep = 48 * devicePixelRatio;
      for (let gx = (cx() % gstep); gx < w; gx += gstep) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
      }
      for (let gy = (cy() % gstep); gy < h; gy += gstep) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
      }
      if (running) {
        const early = Math.min(score, 10);
        const late = Math.max(0, score - 10);
        difficulty = 1 + early * 0.13 + late * 0.045;
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnThreat();
          if (score > 8 && Math.random() < 0.28) spawnThreat();
          spawnTimer = Math.max(0.24, 0.7 - difficulty * 0.1);
        }
        for (let i = arcs.length - 1; i >= 0; i--) {
          const a = arcs[i];
          a.life -= dt;
          if (a.life <= 0) { arcs.splice(i, 1); continue; }
          const alpha = a.life / a.max;
          const reach = Math.min(w, h) * 0.4;
          ctx.beginPath();
          ctx.moveTo(cx(), cy());
          ctx.arc(cx(), cy(), reach, a.ang - a.width * 0.5, a.ang + a.width * 0.5);
          ctx.closePath();
          ctx.fillStyle = 'rgba(83,230,255,' + (0.18 * alpha) + ')';
          ctx.fill();
          ctx.strokeStyle = 'rgba(83,230,255,' + (0.85 * alpha) + ')';
          ctx.lineWidth = 3 * devicePixelRatio;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx(), cy(), reach, a.ang - a.width * 0.5, a.ang + a.width * 0.5);
          ctx.strokeStyle = 'rgba(110,231,255,' + (0.4 * alpha) + ')';
          ctx.lineWidth = 8 * devicePixelRatio;
          ctx.stroke();
        }
        for (let i = threats.length - 1; i >= 0; i--) {
          const th = threats[i];
          const tdx0 = cx() - th.x, tdy0 = cy() - th.y;
          const td0 = Math.hypot(tdx0, tdy0) || 1;
          th.ux = tdx0 / td0;
          th.uy = tdy0 / td0;
          const spd = (140 + difficulty * 70 + early * 6 + late * 2.2) * devicePixelRatio;
          th.x += th.ux * spd * dt;
          th.y += th.uy * spd * dt;
          let hit = false;
          const tdx = th.x - cx(), tdy = th.y - cy();
          const tang = Math.atan2(tdy, tdx);
          const tdist = Math.hypot(tdx, tdy);
          for (const a of arcs) {
            let d = Math.abs(((tang - a.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
            if (d < a.width * 0.7 && tdist < Math.min(w, h) * 0.44) {
              hit = true; break;
            }
          }
          if (hit) {
            score += 1;
            scoreEl.textContent = String(score);
            audio.score();
            burst(th.x, th.y, '#53E6FF', 10);
            threats.splice(i, 1);
            continue;
          }
          if (tdist < CORE_R * devicePixelRatio + th.r * 0.6) {
            die();
            break;
          }
          ctx.beginPath();
          ctx.arc(th.x, th.y, th.r, 0, Math.PI * 2);
          ctx.fillStyle = '#FF4FD8';
          ctx.shadowColor = '#FF4FD8';
          ctx.shadowBlur = 12 * devicePixelRatio;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(th.x, th.y, th.r * 0.45, 0, Math.PI * 2);
          ctx.fillStyle = '#FF9AE8';
          ctx.fill();
        }
        const pulse = 1 + Math.sin(t * 6) * 0.04;
        ctx.beginPath();
        ctx.arc(cx(), cy(), CORE_R * devicePixelRatio * pulse, 0, Math.PI * 2);
        ctx.fillStyle = '#53E6FF';
        ctx.shadowColor = '#53E6FF';
        ctx.shadowBlur = 22 * devicePixelRatio;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx(), cy(), CORE_R * devicePixelRatio * 0.45 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = '#E8FBFF';
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(cx(), cy(), CORE_R * devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = '#53E6FF88';
        ctx.fill();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        const al = p.life / p.max;
        ctx.globalAlpha = al;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5 * devicePixelRatio * al, 0, Math.PI * 2);
        ctx.fillStyle = p.col;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
